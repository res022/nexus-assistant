{% extends "base.html" %}

{% block title %}{{ law.law_name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="law-detail-header">
        <a href="/browse" class="back-link">← უკან კანონების სიაში</a>
        <h1>{{ law.law_name }}</h1>
        <div class="law-meta">
            <span class="meta-item">📄 {{ law.filename }}</span>
        </div>
    </div>

    <div class="law-detail-content">
        <div class="law-text-content">
            {{ law.georgian_text | replace('
', '<br>') | safe }}
        </div>
    </div>
</div>
{% endblock %}
